[project]
name = "sendit-api"
version = "0.1.0"
description = "SendIt API"
requires-python = ">=3.12"
dependencies = [
    "aiofiles==25.1.0",
    "alembic==1.18.5",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "bcrypt==4.0.1",
    "black==26.5.1",
    "certifi==2026.7.22",
    "cffi==2.1.0",
    "click==8.4.2",
    "colorama==0.4.6",
    "coverage==7.15.3",
    "cryptography==50.0.0",
    "deprecated==1.3.1",
    "ecdsa==0.19.2",
    "fastapi==0.141.1",
    "greenlet==3.5.4",
    "h11==0.16.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.18",
    "iniconfig==2.3.0",
    "limits==5.8.0",
    "mako==1.3.12",
    "markupsafe==3.0.3",
    "packaging==26.2",
    "passlib==1.7.4",
    "pluggy==1.6.0",
    "psutil==7.2.2",
    "psycopg2-binary==2.9.12",
    "py-cpuinfo==9.0.0",
    "pyasn1==0.6.4",
    "pycparser==3.0",
    "pydantic==2.13.4",
    "pydantic-core==2.46.4",
    "pygments==2.20.0",
    "pytest==9.1.1",
    "pytest-benchmark==5.2.3",
    "pytest-cov==7.1.0",
    "python-dotenv==1.2.2",
    "python-jose==3.5.0",
    "python-multipart==0.0.32",
    "rsa==4.9.1",
    "ruff==0.16.2",
    "six==1.17.0",
    "slowapi==0.1.10",
    "sqlalchemy==2.0.51",
    "sqlmodel==0.0.39",
    "starlette==1.3.1",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.2",
    "uvicorn==0.52.0",
    "wrapt==2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = [
    "B008",
    "BLE001",
    "DTZ003",
    "UP037",
]
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["."]
omit = [
    "tests/*",
    ".venv/*",
    "venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
]
fail_under = 70
